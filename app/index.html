<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descargá MiNegocio+</title>
<meta property="og:title" content="Descargá la app MiNegocio+">
<meta property="og:description" content="Hacé tus pedidos de Pepsico desde la app. Descargala gratis.">
<style>
  body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7fb;color:#1a2540;text-align:center}
  .card{background:#fff;padding:32px 24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);max-width:340px;width:90%}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 20px;color:#556}
  a.btn{display:block;padding:14px;margin:10px 0;border-radius:10px;background:#0a4ea3;color:#fff;text-decoration:none;font-weight:600}
  a.btn.play{background:#1a7f4b}
</style>
<script>
  var IOS = "https://apps.apple.com/ar/app/minegocio-ar/id6569248139";
  var ANDROID = "https://play.google.com/store/apps/details?id=com.PepsiCoConsumer.Minegocioar";
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  if (isIOS) { location.replace(IOS); }
  else if (isAndroid) { location.replace(ANDROID); }
</script>
</head>
<body>
  <div class="card">
    <h1>App MiNegocio+</h1>
    <p>Elegí tu tienda para descargarla gratis:</p>
    <a class="btn play" href="https://play.google.com/store/apps/details?id=com.PepsiCoConsumer.Minegocioar">Android · Google Play</a>
    <a class="btn" href="https://apps.apple.com/ar/app/minegocio-ar/id6569248139">iPhone · App Store</a>
  </div>
</body>
</html>
